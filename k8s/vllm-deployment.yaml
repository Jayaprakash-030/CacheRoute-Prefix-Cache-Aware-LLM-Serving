# vLLM Deployment: 1 replica, 1 GPU, prefix caching on.
# The same settings (block size 64, KV-events, render endpoints) are used in all three benchmark runs;
# only precise routing actually listens to the events.
# Phase 1a. Apply (after namespace.yaml) with: sudo k3s kubectl apply -f vllm-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: cacheroute         # all project objects live in this namespace (see namespace.yaml)
  labels:
    app: vllm
spec:
  replicas: 1                      # becomes 4 on the big machine (Phase 1b)
  strategy:
    type: Recreate                 # stop the old pod before starting the new one; every GPU is in use, so a rolling update would hang in Pending
  selector:
    matchLabels:
      app: vllm                    # must match the pod labels below
  template:
    metadata:
      labels:
        app: vllm                  # the Service (next step) finds pods by this label
    spec:
      runtimeClassName: nvidia     # lets the container see the GPU (k3s created this class)
      enableServiceLinks: false    # stop Kubernetes injecting VLLM_PORT=tcp://... (from the Service named "vllm"), which crashes vLLM
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          args:
            - --model=meta-llama/Llama-3.1-8B-Instruct   # decided model (gated on Hugging Face)
            - --enable-prefix-caching              # reuse cached KV blocks for shared prompt prefixes
            - --max-model-len=8192                 # cap context length so the KV cache fits in 24 GB
            - --gpu-memory-utilization=0.90        # share of GPU memory vLLM may claim
            - --block-size=64                      # cache block size in tokens; 64 in all three runs (precise routing needs it, so keep it fixed for fairness)
            - --port=8000
            - --enable-scale-out                   # serves the /v1/*/render endpoints the precise router uses to tokenize prompts
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render   # keep router calls out of the logs
            - --kv-events-config                   # publish a message whenever a cache block is added or removed (precise routing listens)
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","replay_endpoint":"$(KV_EVENTS_REPLAY_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@meta-llama/Llama-3.1-8B-Instruct"}'
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 5556                  # KV-events port (the router connects here)
              name: kv-events
            - containerPort: 5559                  # replay port (router re-fetches missed events)
              name: kv-replay
          env:
            - name: POD_IP                         # this pod's own IP, filled in by Kubernetes
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_PORT
              value: "8000"
            - name: KV_EVENTS_ENDPOINT             # used by --kv-events-config above
              value: "tcp://*:5556"
            - name: KV_EVENTS_REPLAY_ENDPOINT
              value: "tcp://*:5559"
            - name: HF_HOME                        # where Hugging Face downloads model files
              value: /models
            - name: HF_TOKEN                       # Llama is gated, so the download needs your token
              valueFrom:
                secretKeyRef:
                  name: hf-token                   # create first, in the cacheroute namespace: kubectl -n cacheroute create secret generic hf-token --from-literal=token=<your token>
                  key: token
          resources:
            limits:
              nvidia.com/gpu: 1                    # exactly one GPU per pod
          readinessProbe:                          # pod counts as Ready (1/1) only when this passes
            httpGet:
              path: /health                        # vLLM returns 200 here once the model is loaded and serving
              port: http
            periodSeconds: 5                       # check every 5 s
            failureThreshold: 3                    # 3 failures in a row marks the pod NotReady again (it is not killed)
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          hostPath:                                # a folder on the instance's own disk
            path: /opt/models                      # survives pod restarts, so no re-download
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory                         # vLLM needs more shared memory than the default 64 MB
            sizeLimit: 2Gi
